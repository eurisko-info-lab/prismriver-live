<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prismriver Live • Lean + Music</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; display:flex; flex-direction:column; height:100vh; background:#1e1e1e; color:#ccc; font-family:system-ui; }
    #topbar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:#252525; border-bottom:2px solid #4a90e2; flex-shrink:0; }
    #topbar h1 { margin:0; font-size:18px; color:#4a90e2; }
    #panels { display:flex; flex:1; min-height:0; }
    #left { flex:1; min-width:200px; display:flex; flex-direction:column; overflow:hidden; }
    #divider {
      width:6px; flex-shrink:0; background:#4a90e2; cursor:col-resize;
      transition: background 0.15s;
    }
    #divider:hover, #divider.dragging { background:#74b3f5; }
    #right { width:360px; min-width:200px; flex-shrink:0; background:#fff; color:#111; overflow:auto; padding:16px; display:flex; flex-direction:column; }
    #leancode {
      flex:1; margin:0; overflow:auto; padding:20px; resize:none; outline:none; border:none;
      background:#1e1e2e; color:#cdd6f4; font-family:ui-monospace,monospace; font-size:14px; line-height:1.6;
      white-space:pre; tab-size:2;
    }
    #toolbar {
      flex-shrink:0; display:flex; align-items:center; gap:8px;
      padding:6px 14px; background:#1a1a2a; border-bottom:1px solid #333;
    }
    #toolbar button {
      padding:5px 18px; background:#4a90e2; color:#fff; border:0; font-size:13px;
      cursor:pointer; border-radius:3px; font-weight:600;
    }
    #toolbar button:hover { background:#357abd; }
    #toolbar span { color:#666; font-size:12px; font-family:ui-monospace,monospace; }
    #proof-divider {
      height:6px; flex-shrink:0; background:#4a90e2; cursor:row-resize;
      transition: background 0.15s;
    }
    #proof-divider:hover, #proof-divider.dragging { background:#74b3f5; }
    #proofbox {
      flex-shrink:0; padding:14px 20px; background:#252530; border-top:2px solid #4a90e2;
      font-family:ui-monospace,monospace; font-size:13px; line-height:1.7; min-height:80px;
      height:150px; overflow:auto;
    }
    #proofbox .label { color:#888; font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
    #proofbox .proven  { color:#a6e3a1; }
    #proofbox .unproven { color:#f38ba8; }
    #proofbox .pending  { color:#89b4fa; }
    #proofbox .axiom   { color:#cba6f7; font-style:italic; }
    #constants-panel {
      background:#f7f9ff; border:1px solid #dbe5ff; border-radius:8px;
      padding:10px 12px; margin:0 0 12px 0;
    }
    #constants-panel .title {
      font-size:12px; color:#2d4f8f; text-transform:uppercase;
      letter-spacing:.05em; margin-bottom:6px; font-weight:700;
    }
    #constants-list {
      margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px;
    }
    #constants-list li { list-style:none; }
    #constants-list button {
      border:1px solid #bcd0ff; background:#fff; color:#1f2a44;
      border-radius:16px; padding:5px 10px; font-size:12px;
      cursor:pointer;
    }
    #constants-list button:hover { background:#edf3ff; }
    #constants-list button.active {
      background:#4a90e2; border-color:#4a90e2; color:#fff;
    }
    #constants-list li.empty { color:#5b6782; }
    #right-tabs {
      display:flex; gap:8px; margin:0 0 12px 0;
    }
    #right-tabs button {
      border:1px solid #c7d6ff; background:#fff; color:#27406e;
      border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600;
      cursor:pointer;
    }
    #right-tabs button.active {
      background:#4a90e2; border-color:#4a90e2; color:#fff;
    }
    #score-view, #tutorial-view { min-height:0; display:flex; flex-direction:column; }
    #score-view[hidden], #tutorial-view[hidden] { display:none !important; }
    #tutorial-content {
      background:#f9fbff; border:1px solid #dbe5ff; border-radius:10px;
      padding:14px; overflow:auto; font-size:13px; line-height:1.55; color:#223455;
    }
    #tutorial-content h2, #tutorial-content h3, #tutorial-content h4 { color:#1f3f77; margin:14px 0 8px 0; }
    #tutorial-content h2 { font-size:16px; }
    #tutorial-content h3 { font-size:14px; }
    #tutorial-content p { margin:8px 0; }
    #tutorial-content ul, #tutorial-content ol { margin:8px 0 8px 18px; padding:0; }
    #tutorial-content pre {
      background:#1e2536; color:#d4ddff; border-radius:8px;
      padding:10px; overflow:auto;
    }
    #tutorial-content code {
      background:#e8efff; color:#1f3760; border-radius:4px; padding:1px 4px;
      font-family:ui-monospace,monospace;
    }
    #score-nav {
      display:flex; align-items:center; gap:8px; margin:0 0 10px 0;
      font-size:12px; color:#304366;
    }
    #score-nav button {
      border:1px solid #bcd0ff; background:#fff; color:#1f2a44;
      border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer;
    }
    #score-nav button:disabled { opacity:0.5; cursor:default; }
    #score { flex:1; }
    a.lean4web { color:#89b4fa; font-size:12px; text-decoration:none; margin-left:auto; }
    a.lean4web:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>🧪 Prismriver Live • Lean 4 + Music</h1>
  </div>
  <div id="panels">
    <div id="left">
      <div id="toolbar">
        <button onclick="prove()">▶ Prove</button>
        <span id="toolbar-hint">Edit the code and click Prove</span>
      </div>
      <textarea id="leancode" spellcheck="false"></textarea>
      <div id="proof-divider"></div>
      <div id="proofbox">
        <div class="label">Lean 4 proof output</div>
        <div id="proofout" class="pending">⟳ Connecting to Lean server…</div>
      </div>
    </div>
    <div id="divider"></div>
    <div id="right">
      <div id="right-tabs">
        <button id="tab-tutorial" type="button" data-tab="tutorial">Tutorial</button>
        <button id="tab-score" type="button" data-tab="score">Score</button>
      </div>

      <div id="tutorial-view">
        <h2 style="margin:0 0 10px 0; font-size:16px;">Bolero Tutorial</h2>
        <div id="tutorial-content">Loading tutorial…</div>
      </div>

      <div id="score-view" hidden>
        <h2 style="margin:0 0 10px 0; font-size:16px;">Score (VexFlow 5)</h2>
        <div id="constants-panel">
          <div class="title">List PNote Constants</div>
          <ul id="constants-list"></ul>
        </div>
        <div id="score-nav">
          <button id="score-prev" type="button">Prev</button>
          <span id="score-window">Notes 1-0 of 0</span>
          <button id="score-next" type="button">Next</button>
        </div>
        <div id="score"></div>
      </div>
    </div>
  </div>

  <script>
    // ── Lean code source ───────────────────────────────────────────────────
    const LEAN_CODE_PATH = 'examples/bolero.lean';
    const README_PATH = 'README.md';

    // Self-contained version for lean4web (uses direct recursion, no foldr)
    const PROOF_CODE =
`-- ostinato/themes as plain lists of the right length
def ostinato : List Nat := List.replicate 4 0
def themeA   : List Nat := List.replicate 8 0
def themeB   : List Nat := List.replicate 8 0

-- Direct structural recursion (avoids foldr argument-order differences)
@[simp] def repeatScore : Nat → List Nat → List Nat
  | 0,     _ => []
  | n + 1, s => s ++ repeatScore n s

def boleroScore : List Nat :=
  repeatScore 9 (repeatScore 16 ostinato ++ themeA ++ themeB)

def layer (i : Nat) : Nat := i
def dynamic (x : Nat) : Nat := x

-- § 1  Concrete lengths (all definitionally true)
theorem ostinato_length : ostinato.length = 4 := rfl
theorem themeA_length   : themeA.length   = 8 := rfl
theorem themeB_length   : themeB.length   = 8 := rfl
theorem themes_equal_length    : themeA.length = themeB.length     := rfl
theorem themes_double_ostinato : themeA.length = 2 * ostinato.length := rfl

-- § 2  repeatScore algebra
-- These are now definitional equations of the recursive function.
theorem repeatScore_zero (s : List Nat) : repeatScore 0 s = [] := rfl
theorem repeatScore_one  (s : List Nat) : repeatScore 1 s = s := List.append_nil s

-- Length scales linearly with the repeat count.
theorem repeatScore_length (n : Nat) (s : List Nat) :
    (repeatScore n s).length = n * s.length := by
  induction n with
  | zero => simp [Nat.zero_mul]
  | succ n ih =>
    show (s ++ repeatScore n s).length = (n + 1) * s.length
    rw [List.length_append, ih, Nat.succ_mul]; omega

-- m + n cycles equals m cycles concatenated with n cycles.
theorem repeatScore_append (m n : Nat) (s : List Nat) :
    repeatScore (m + n) s = repeatScore m s ++ repeatScore n s := by
  induction m with
  | zero => simp
  | succ m ih =>
    simp only [Nat.succ_add, repeatScore]
    rw [ih, List.append_assoc]

-- § 3  Full score
-- 9 × (16 × 4 + 8 + 8) = 9 × 80 = 720
theorem boleroScore_length : boleroScore.length = 720 := by
  simp [boleroScore, repeatScore_length, List.length_append,
        ostinato_length, themeA_length, themeB_length]

-- § 4  Dynamics
theorem crescendo_monotonic : ∀ i, dynamic (layer i) < dynamic (layer (i + 1)) := by
  intro i; simp [layer, dynamic]
theorem dynamic_mono {i j : Nat} (h : i ≤ j) :
    dynamic (layer i) ≤ dynamic (layer j) := by
  simp [layer, dynamic]; exact h

-- § 5  Axiom audit
#print axioms crescendo_monotonic
#print axioms repeatScore_length
#print axioms repeatScore_append
#print axioms boleroScore_length
#print axioms dynamic_mono`;

    async function loadLeanCodeFromFile() {
      const editor = document.getElementById('leancode');
      const hint = document.getElementById('toolbar-hint');
      hint.textContent = `Loading ${LEAN_CODE_PATH}…`;
      try {
        const res = await fetch(LEAN_CODE_PATH, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        editor.value = await res.text();
        hint.textContent = 'Edit the code and click Prove';
      } catch (err) {
        editor.value = '-- Could not load examples/bolero.lean\n';
        hint.textContent = 'Failed to load bolero.lean';
      }
    }

    function escapeHtml(s) {
      return s
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function formatInline(text) {
      const parts = text.split(/(`[^`]+`)/g);
      return parts.map(p => {
        if (p.startsWith('`') && p.endsWith('`')) {
          return `<code>${escapeHtml(p.slice(1, -1))}</code>`;
        }
        return escapeHtml(p);
      }).join('');
    }

    function markdownToHtml(md) {
      const lines = md.split('\n');
      const out = [];
      let inCode = false;
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) { out.push('</ul>'); inUl = false; }
        if (inOl) { out.push('</ol>'); inOl = false; }
      };

      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          closeLists();
          if (!inCode) { out.push('<pre><code>'); inCode = true; }
          else { out.push('</code></pre>'); inCode = false; }
          continue;
        }

        if (inCode) {
          out.push(`${escapeHtml(line)}\n`);
          continue;
        }

        const h = line.match(/^(#{1,4})\s+(.*)$/);
        if (h) {
          closeLists();
          const level = h[1].length;
          out.push(`<h${level}>${formatInline(h[2])}</h${level}>`);
          continue;
        }

        const ul = line.match(/^\s*[-*]\s+(.*)$/);
        if (ul) {
          if (!inUl) { closeLists(); out.push('<ul>'); inUl = true; }
          out.push(`<li>${formatInline(ul[1])}</li>`);
          continue;
        }

        const ol = line.match(/^\s*\d+\.\s+(.*)$/);
        if (ol) {
          if (!inOl) { closeLists(); out.push('<ol>'); inOl = true; }
          out.push(`<li>${formatInline(ol[1])}</li>`);
          continue;
        }

        if (!line.trim()) {
          closeLists();
          continue;
        }

        closeLists();
        out.push(`<p>${formatInline(line)}</p>`);
      }

      closeLists();
      if (inCode) out.push('</code></pre>');
      return out.join('\n');
    }

    function extractTutorialSection(md) {
      const marker = '## Tutorial:';
      const idx = md.indexOf(marker);
      if (idx === -1) return md;
      return md.slice(idx);
    }

    async function loadTutorialFromFile() {
      const container = document.getElementById('tutorial-content');
      try {
        const res = await fetch(README_PATH, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();
        container.innerHTML = markdownToHtml(extractTutorialSection(md));
      } catch (err) {
        container.textContent = 'Could not load tutorial from README.md';
      }
    }

    function setRightTab(tab) {
      const scoreView = document.getElementById('score-view');
      const tutorialView = document.getElementById('tutorial-view');
      document.querySelectorAll('#right-tabs button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });

      if (tab === 'score') {
        scoreView.hidden = false;
        tutorialView.hidden = true;
        renderBolero(currentConstant);
      } else {
        scoreView.hidden = true;
        tutorialView.hidden = false;
      }
    }

    function extractListPNoteConstants(code) {
      const re = /^\s*def\s+([A-Za-z_][\w']*)\s*:\s*List\s+PNote\s*:=/gm;
      const names = [];
      let match;
      while ((match = re.exec(code)) !== null) {
        names.push(match[1]);
      }
      return [...new Set(names)];
    }

    function extractListPNoteDefinitions(code) {
      const lines = code.split('\n');
      const defs = new Map();
      for (let i = 0; i < lines.length; i++) {
        const m = lines[i].match(/^\s*def\s+([A-Za-z_][\w']*)\s*:\s*List\s+PNote\s*:=\s*(.*)$/);
        if (!m) continue;
        const name = m[1];
        let body = m[2].trim();
        if (!body) {
          const next = lines[i + 1] || '';
          body = next.trim();
        }
        defs.set(name, stripInlineComment(body));
      }
      return defs;
    }

    function stripInlineComment(expr) {
      return expr.replace(/\s+--.*$/, '').trim();
    }

    function stripOuterParens(expr) {
      let s = expr.trim();
      while (s.startsWith('(') && s.endsWith(')')) {
        let depth = 0;
        let balanced = true;
        for (let i = 0; i < s.length; i++) {
          const ch = s[i];
          if (ch === '(') depth++;
          if (ch === ')') depth--;
          if (depth === 0 && i < s.length - 1) { balanced = false; break; }
        }
        if (!balanced) break;
        s = s.slice(1, -1).trim();
      }
      return s;
    }

    function splitTopLevelAppend(expr) {
      const parts = [];
      let depth = 0;
      let start = 0;
      for (let i = 0; i < expr.length - 1; i++) {
        const ch = expr[i];
        if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (depth === 0 && expr[i] === '+' && expr[i + 1] === '+') {
          parts.push(expr.slice(start, i).trim());
          start = i + 2;
          i++;
        }
      }
      parts.push(expr.slice(start).trim());
      return parts.filter(Boolean);
    }

    function parsePNoteLiteral(expr) {
      const m = expr.match(/^♩\[([^\]]*)\]$/);
      if (!m) return null;
      return m[1].trim().split(/\s+/).filter(Boolean);
    }

    function evaluatePNoteExpr(expr, defs, memo, stack) {
      const s = stripOuterParens(stripInlineComment(expr));

      const literal = parsePNoteLiteral(s);
      if (literal) return literal;

      if (/^[A-Za-z_][\w']*$/.test(s) && defs.has(s)) {
        if (memo.has(s)) return memo.get(s);
        if (stack.has(s)) return [];
        stack.add(s);
        const value = evaluatePNoteExpr(defs.get(s), defs, memo, stack);
        stack.delete(s);
        memo.set(s, value);
        return value;
      }

      const appendParts = splitTopLevelAppend(s);
      if (appendParts.length > 1) {
        return appendParts.flatMap(part => evaluatePNoteExpr(part, defs, memo, stack));
      }

      const repeatMatch = s.match(/^repeatScore\s+(\d+)\s+(.+)$/);
      if (repeatMatch) {
        const n = Number(repeatMatch[1]);
        const seq = evaluatePNoteExpr(repeatMatch[2], defs, memo, stack);
        const out = [];
        for (let i = 0; i < n; i++) out.push(...seq);
        return out;
      }

      return [];
    }

    function noteToVex(token) {
      const m = token.toLowerCase().match(/^([a-g])([#b]?)(\d)$/);
      if (!m) return null;
      const [, pitch, accidental, octave] = m;
      return `${pitch}${accidental}${octave}`;
    }

    function dynamicMark(t) {
      if (t < 0.16) return 'pp';
      if (t < 0.32) return 'p';
      if (t < 0.50) return 'mp';
      if (t < 0.68) return 'mf';
      if (t < 0.84) return 'f';
      return 'ff';
    }

    let currentConstant = null;
    let currentDefinitions = new Map();
    let currentPreviewOffset = 0;
    let currentTokenCount = 0;
    let currentMaxVisible = 64;

    function selectConstant(name) {
      currentConstant = name;
      currentPreviewOffset = 0;
      document.querySelectorAll('#constants-list button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.constant === name);
      });
      renderBolero(name);
    }

    function updateScoreNav() {
      const total = currentTokenCount;
      const start = total === 0 ? 0 : currentPreviewOffset + 1;
      const end = Math.min(total, currentPreviewOffset + currentMaxVisible);
      const prevBtn = document.getElementById('score-prev');
      const nextBtn = document.getElementById('score-next');
      const label = document.getElementById('score-window');
      label.textContent = `Notes ${start}-${end} of ${total}`;
      prevBtn.disabled = currentPreviewOffset <= 0;
      nextBtn.disabled = currentPreviewOffset + currentMaxVisible >= total;
    }

    function renderListPNoteConstants() {
      const code = document.getElementById('leancode').value;
      const names = extractListPNoteConstants(code);
      currentDefinitions = extractListPNoteDefinitions(code);
      const ul = document.getElementById('constants-list');
      ul.innerHTML = '';
      if (names.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'No constants of type List PNote found.';
        ul.appendChild(li);
        currentConstant = null;
        renderBolero(null);
        return;
      }

      let nextConstant = currentConstant;
      if (!nextConstant || !names.includes(nextConstant)) {
        nextConstant = names[0];
      }

      names.forEach(name => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = name;
        btn.dataset.constant = name;
        btn.addEventListener('click', () => selectConstant(name));
        li.appendChild(btn);
        ul.appendChild(li);
      });

      selectConstant(nextConstant);
    }

    document.getElementById('leancode').addEventListener('input', renderListPNoteConstants);

    // ── Lean proof via lean4web WebSocket ──────────────────────────────────
    const FILE_URI = 'file:///MathlibDemo.lean';
    let msgId = 1;

    function runLean(code, onResult) {
      const out = document.getElementById('proofout');
      out.className = 'pending';
      out.textContent = '⟳ Compiling…';

      let ws;
      try { ws = new WebSocket('wss://live.lean-lang.org/websocket/MathlibDemo'); }
      catch(e) { out.className = 'unproven'; out.textContent = '⚠ Could not connect to Lean server.'; return; }

      let initialized = false;
      const diagnostics = [];
      let done = false;

      function send(msg) { ws.send(JSON.stringify(msg)); }

      ws.onopen = () => {
        send({ jsonrpc:'2.0', id: msgId++, method:'initialize', params:{
          processId: null,
          rootUri: 'file:///',
          capabilities: { textDocument: { publishDiagnostics: { relatedInformation: true } } },
          initializationOptions: {}
        }});
      };

      ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        // Response to initialize → send initialized + didOpen
        if (msg.id === 1 && msg.result) {
          send({ jsonrpc:'2.0', method:'initialized', params:{} });
          send({ jsonrpc:'2.0', method:'textDocument/didOpen', params:{
            textDocument: { uri: FILE_URI, languageId:'lean4', version:1, text: code }
          }});
          initialized = true;
        }

        // Diagnostics from Lean — each event replaces the previous set (LSP semantics)
        if (msg.method === 'textDocument/publishDiagnostics' && initialized) {
          const diags = msg.params?.diagnostics ?? [];
          diagnostics.length = 0;
          diags.forEach(d => diagnostics.push(d));
        }

        // File processing done
        if (msg.method === '$/lean/fileProgress' && initialized && !done) {
          const items = msg.params?.processing ?? [];
          const stillProcessing = items.some(i => i.kind === 1);
          if (!stillProcessing && diagnostics.length >= 0) {
            done = true;
            ws.close();
            onResult(diagnostics);
          }
        }
      };

      ws.onerror = () => {
        out.className = 'unproven';
        out.textContent = '⚠ Lean server connection error.';
      };

      // Fallback timeout: show results after 30s regardless
      setTimeout(() => {
        if (!done) { done = true; try { ws.close(); } catch {} onResult(diagnostics); }
      }, 30000);
    }

    function showResult(diagnostics) {
      const out = document.getElementById('proofout');
      // Info diagnostics (severity 3) contain #print axioms output
      const infos = diagnostics.filter(d => d.severity === 3 || d.severity == null);
      const errors = diagnostics.filter(d => d.severity === 1);
      const warnings = diagnostics.filter(d => d.severity === 2);

      if (errors.length > 0) {
        out.className = 'unproven';
        out.innerHTML = errors.map(d =>
          `❌ <strong>${d.message}</strong>`
        ).join('\n');
        return;
      }

      if (warnings.some(d => /sorry/i.test(d.message))) {
        out.className = 'unproven';
        out.textContent = "⚠ crescendo_monotonic depends on axioms: [sorryAx]  — not proven";
        return;
      }

      const axiomMsgs = infos.filter(d => /depends on axioms/.test(d.message));
      if (axiomMsgs.length > 0) {
        const hasSorry = axiomMsgs.some(d => /sorryAx/.test(d.message));
        out.className = hasSorry ? 'unproven' : 'proven';
        out.innerHTML = axiomMsgs.map(d => {
          const sorry = /sorryAx/.test(d.message);
          const icon = sorry ? '❌' : '✅';
          const formatted = d.message.replace(
            /\[([^\]]+)\]/,
            (_, inner) => `[<span class="axiom">${inner}</span>]`
          );
          return `${icon} ${formatted}`;
        }).join('\n');
        return;
      }

      if (infos.length > 0) {
        out.className = 'proven';
        out.textContent = infos.map(d => d.message).join('\n');
        return;
      }

      out.className = 'proven';
      out.textContent = '✅ No errors or warnings.';
    }

    // ── VexFlow score ──────────────────────────────────────────────────────
    function renderBolero(constantName = null) {
      const div = document.getElementById("score");
      div.innerHTML = "";
      const VF = VexFlow;
      const w = Math.max(260, div.getBoundingClientRect().width || 340);
      const notesPerLine = 16;
      const maxVisible = 720;

      let tokens = [];
      if (constantName && currentDefinitions.has(constantName)) {
        tokens = evaluatePNoteExpr(currentDefinitions.get(constantName), currentDefinitions, new Map(), new Set());
      }

      if (tokens.length === 0) {
        tokens = ["c4", "d4", "e4", "f4"];
      }

      currentTokenCount = tokens.length;
      currentMaxVisible = maxVisible;
      const maxOffset = Math.max(0, tokens.length - maxVisible);
      currentPreviewOffset = Math.min(Math.max(0, currentPreviewOffset), maxOffset);
      const visibleTokens = tokens.slice(currentPreviewOffset, currentPreviewOffset + maxVisible);
      const vexNotes = visibleTokens.map(noteToVex).filter(Boolean);
      const rendered = vexNotes.length > 0 ? vexNotes : ["c4", "d4", "e4", "f4"];
      const lineCount = Math.max(1, Math.ceil(rendered.length / notesPerLine));
      const height = Math.max(220, 60 + lineCount * 90);

      const vf = new VF.Factory({ renderer: { elementId: "score", width: w, height } });
      const score = vf.EasyScore();
      const crescendoLines = [];
      const denom = Math.max(1, tokens.length - 1);

      for (let i = 0; i < lineCount; i++) {
        const chunk = rendered.slice(i * notesPerLine, (i + 1) * notesPerLine);
        const system = vf.System({ x: 10, y: 40 + i * 86, width: Math.max(120, w - 20) });
        const voice = new VF.Voice({ numBeats: chunk.length, beatValue: 4 });
        voice.setStrict(false);
        const staveNotes = score.notes(chunk.map(n => `${n}/4`).join(", "), { stem: "up" });

        // Visual crescendo: progressively intensify note color from soft to strong.
        staveNotes.forEach((note, j) => {
          const globalIndex = currentPreviewOffset + i * notesPerLine + j;
          const t = Math.min(1, Math.max(0, globalIndex / denom));
          const shade = Math.round(135 - (115 * t));
          const alpha = (0.45 + 0.55 * t).toFixed(3);
          const color = `rgba(${shade}, ${shade}, ${shade}, ${alpha})`;
          if (typeof note.setStyle === 'function') {
            note.setStyle({ fillStyle: color, strokeStyle: color });
          }
          if (typeof note.setStemStyle === 'function') {
            note.setStemStyle({ fillStyle: color, strokeStyle: color });
          }
        });

        voice.addTickables(staveNotes);
        const stave = system.addStave({ voices: [voice] });
        stave.addClef("treble");
        if (i === 0) stave.addTimeSignature(`${chunk.length}/4`);

        const lineStart = currentPreviewOffset + i * notesPerLine;
        const lineEnd = Math.min(currentPreviewOffset + (i + 1) * notesPerLine - 1, tokens.length - 1);
        const startDyn = dynamicMark(lineStart / denom);
        const endDyn = dynamicMark(lineEnd / denom);
        crescendoLines.push({ y: 40 + i * 86, startDyn, endDyn });
      }

      vf.draw();

      const svg = div.querySelector("svg");
      if (svg) {
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x","10"); t.setAttribute("y","28");
        t.setAttribute("fill","#111"); t.setAttribute("font-size","15");
        const title = constantName ? `${constantName} (${tokens.length} notes)` : "Ravel – Boléro (demo)";
        t.textContent = title;
        svg.appendChild(t);

        if (tokens.length > maxVisible) {
          const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
          t2.setAttribute("x", "10"); t2.setAttribute("y", "46");
          t2.setAttribute("fill", "#555"); t2.setAttribute("font-size", "12");
          const start = currentPreviewOffset + 1;
          const end = Math.min(tokens.length, currentPreviewOffset + maxVisible);
          t2.textContent = `Showing notes ${start}-${end} of ${tokens.length}`;
          svg.appendChild(t2);
        }

        // Add per-line dynamic hints so crescendo is explicit and readable.
        crescendoLines.forEach(line => {
          const d = document.createElementNS("http://www.w3.org/2000/svg", "text");
          d.setAttribute("x", "84");
          d.setAttribute("y", String(line.y + 14));
          d.setAttribute("fill", "#6d7a94");
          d.setAttribute("font-size", "11");
          d.textContent = `${line.startDyn} -> ${line.endDyn}`;
          svg.appendChild(d);
        });
      }

      updateScoreNav();
    }

    function prove() {
      document.getElementById('toolbar-hint').textContent = 'Sending to Lean server…';
      runLean(PROOF_CODE, (diags) => {
        document.getElementById('toolbar-hint').textContent = 'Edit the code and click Prove';
        showResult(diags);
      });
    }

    // ── Resizable divider ───────────────────────────────────────────────────────
    (function() {
      document.querySelectorAll('#right-tabs button').forEach(btn => {
        btn.addEventListener('click', () => setRightTab(btn.dataset.tab));
      });

      document.getElementById('score-prev').addEventListener('click', () => {
        currentPreviewOffset = Math.max(0, currentPreviewOffset - currentMaxVisible);
        renderBolero(currentConstant);
      });
      document.getElementById('score-next').addEventListener('click', () => {
        currentPreviewOffset = currentPreviewOffset + currentMaxVisible;
        renderBolero(currentConstant);
      });

      const proofDivider = document.getElementById('proof-divider');
      const proofBox = document.getElementById('proofbox');
      const left = document.getElementById('left');
      const toolbar = document.getElementById('toolbar');
      let proofDragging = false;
      let proofStartY = 0;
      let proofStartH = 0;

      proofDivider.addEventListener('mousedown', e => {
        proofDragging = true;
        proofStartY = e.clientY;
        proofStartH = proofBox.getBoundingClientRect().height;
        proofDivider.classList.add('dragging');
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', e => {
        if (!proofDragging) return;
        const delta = proofStartY - e.clientY;
        const leftH = left.getBoundingClientRect().height;
        const toolbarH = toolbar.getBoundingClientRect().height;
        const dividerH = proofDivider.getBoundingClientRect().height;
        const minProofH = 80;
        const minEditorH = 120;
        const maxProofH = Math.max(minProofH, leftH - toolbarH - dividerH - minEditorH);
        const nextH = Math.max(minProofH, Math.min(maxProofH, proofStartH + delta));
        proofBox.style.height = `${nextH}px`;
        proofBox.style.flex = 'none';
      });

      document.addEventListener('mouseup', () => {
        if (!proofDragging) return;
        proofDragging = false;
        proofDivider.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });

      const divider = document.getElementById('divider');
      const right = document.getElementById('right');
      let dragging = false, startX = 0, startW = 0;
      divider.addEventListener('mousedown', e => {
        dragging = true;
        startX = e.clientX;
        startW = right.getBoundingClientRect().width;
        divider.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });
      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const delta = startX - e.clientX;
        right.style.width = Math.max(200, startW + delta) + 'px';
        right.style.flex = 'none';
        renderBolero(currentConstant);
      });
      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });
    })();

    window.onload = async () => {
      await Promise.all([loadLeanCodeFromFile(), loadTutorialFromFile()]);
      renderListPNoteConstants();
      setRightTab('tutorial');
      prove();
    };
  </script>
